<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5-Day Forecast ☁️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  min-height:100vh;
  color:#fff;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  animation:bgShift 15s ease-in-out infinite alternate;
}
@keyframes bgShift{
  from{background-position:0% 50%;}
  to{background-position:100% 50%;}
}
nav{
  position:fixed;top:0;width:100%;
  background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);
  text-align:center;padding:10px;z-index:100;
}
nav a{margin:0 20px;color:#00feba;text-decoration:none;font-weight:500;transition:0.3s;}
nav a:hover{color:#fff;text-shadow:0 0 10px #00feba;}

h1{margin-top:80px;font-size:2em;text-shadow:0 0 10px rgba(0,255,255,0.6);}
.search-bar{margin-top:30px;display:flex;justify-content:center;gap:10px;}
.search-bar input{
  padding:10px 20px;border-radius:30px;border:none;outline:none;font-size:16px;color:#333;
}
.search-bar button{
  border:none;border-radius:50%;width:45px;height:45px;
  background:linear-gradient(135deg,#00feba,#5b548a);
  cursor:pointer;transition:0.3s;
}
.search-bar button:hover{transform:rotate(360deg);box-shadow:0 0 15px #00feba;}

.container{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;width:80%;margin:40px 0;
}
.day{
  background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.05));
  border-radius:20px;text-align:center;padding:20px;position:relative;
  box-shadow:0 0 25px rgba(0,255,255,0.1);transition:0.4s;overflow:hidden;
}
.day:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 0 35px rgba(0,255,200,0.4);}
.day::before{
  content:"";position:absolute;top:-50%;left:-50%;
  width:200%;height:200%;
  background:conic-gradient(from 180deg,#00feba,#5b548a,#ff4b5c,#00feba);
  animation:rotate 6s linear infinite;
  filter:blur(40px);opacity:0.4;z-index:-1;
}
@keyframes rotate{to{transform:rotate(360deg);}}
.day img{width:70px;margin-bottom:10px;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.day h3{font-size:20px;margin-bottom:5px;}
.day p{font-size:16px;margin:5px 0;}
footer{margin-top:20px;color:#ddd;opacity:0.8;}
footer:hover{opacity:1;text-shadow:0 0 10px #00feba;}
</style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="forecast.html">Forecast</a>
  <a href="tips.html">Tips</a>
  <a href="about.html">About</a>
</nav>

<h1>5-Day Weather Forecast</h1>

<div class="search-bar">
  <input type="text" id="forecastCity" placeholder="Enter city for forecast...">
  <button onclick="getForecast()"><img src="search.png" width="18"></button>
</div>

<div class="container" id="forecastContainer">
  <p style="text-align:center;width:100%;opacity:0.8;">Search for a city to view forecast ⛅</p>
</div>

<footer>🌦️ Forecast powered by OpenWeatherMap API</footer>
<script src="main.js"></script>
</body>
</html>
